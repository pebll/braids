#
# Flatpak of braids, made from the release tarball (utils/dist/package-linux)
# on the GNOME runtime, which has WebKitGTK and GStreamer. Built in the release
# workflow; by hand, from the repository root:
#
#   utils/dist/package-linux
#   git clone --depth 1 https://github.com/flathub/shared-modules utils/dist/flatpak/shared-modules
#   flatpak-builder --user --install --force-clean build-flatpak utils/dist/flatpak/io.github.pebll.braids.yml
#
# The data lives in ~/.var/app/io.github.pebll.braids (not ~/.config/braids).
#
# Flathub builds open source apps from source only (no prebuilt tarball):
# this manifest is for the release's .flatpak; see doc/BACKLOG.md.

app-id: io.github.pebll.braids
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: braids
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # voice messages: record and play
  - --socket=pulseaudio
  # tray icon and notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # saving attachments ("Download file")
  - --filesystem=xdg-download

# videos: H.264 and AAC through the runtime's FFmpeg extension (GNOME 48 is
# on freedesktop 24.08)
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    autodownload: true
    autodelete: false
cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # libmagic (file types of attachments), not in the runtime
  - name: libmagic
    buildsystem: simple
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=/app --disable-static --enable-shared --disable-bzlib --disable-xzlib --disable-zstdlib --disable-lzlib
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    cleanup:
      - /bin
      - /include
      - /share/man
      - '*.la'
    sources:
      - type: git
        url: https://github.com/file/file.git
        tag: FILE5_46
        commit: b310a0c2d3e4a1c12d579ad5c0266f1092a91340

  - name: braids
    buildsystem: simple
    build-commands:
      - cp -a tree/bin tree/lib /app/
      - mkdir -p /app/share
      - cp -a tree/share/. /app/share/
      - rm -f /app/share/braids-install.sh /app/share/applications/braids.desktop
      - rm -f /app/share/icons/hicolor/128x128/apps/braids.png /app/share/icons/hicolor/256x256/apps/braids.png
      - install -Dm644 tree/share/icons/hicolor/128x128/apps/braids.png /app/share/icons/hicolor/128x128/apps/io.github.pebll.braids.png
      - install -Dm644 tree/share/icons/hicolor/256x256/apps/braids.png /app/share/icons/hicolor/256x256/apps/io.github.pebll.braids.png
      - install -Dm644 tree/share/icons/hicolor/scalable/apps/braids.svg /app/share/icons/hicolor/scalable/apps/io.github.pebll.braids.svg
      - rm -f /app/share/icons/hicolor/scalable/apps/braids.svg
      - install -Dm644 io.github.pebll.braids.desktop /app/share/applications/io.github.pebll.braids.desktop
      - install -Dm644 io.github.pebll.braids.metainfo.xml /app/share/metainfo/io.github.pebll.braids.metainfo.xml
    sources:
      - type: archive
        path: ../../../dist/braids-linux-x86_64.tar.gz
        dest: tree
        only-arches: [x86_64]
      - type: archive
        path: ../../../dist/braids-linux-aarch64.tar.gz
        dest: tree
        only-arches: [aarch64]
      - type: file
        path: io.github.pebll.braids.desktop
      - type: file
        path: io.github.pebll.braids.metainfo.xml
