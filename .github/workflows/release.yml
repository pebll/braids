name: Release

# Linux release packages: on a version tag (v*) they are attached to a GitHub
# release, which install.sh downloads from; started by hand they are kept as
# workflow artifacts only.
#
#   braids-linux-<arch>.tar.gz, braids_<version>_<debarch>.deb,
#   braids-<arch>.AppImage (utils/dist/package-linux), braids-<arch>.flatpak
#   (utils/dist/flatpak), for x86_64 and aarch64 (ARM64).
#
# Telegram needs braids' API credentials as repository secrets TG_API_ID and
# TG_API_HASH (Settings -> Secrets and variables -> Actions).
#
# Built on the oldest supported Ubuntu runners so the binaries run on older
# glibc versions too.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Flathub page lists the released versions
      run: python3 utils/dist/flatpak/update-releases --check
    - name: Setup ccache
      uses: ./.github/actions/setup-ccache
      with:
        cache_key_prefix: release-${{ matrix.arch }}
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: app/package-lock.json
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: lib/wmchat/go/go.mod
        cache: true
        cache-dependency-path: lib/*/go/go.sum
    - name: System dependencies
      run: |
        ./make.sh deps -y
        # the runner image has LLVM's libunwind-<n>-dev, which conflicts with
        # the libunwind-dev that libgstreamer1.0-dev needs
        dpkg -l | awk '/^ii +libunwind-[0-9]+-dev/ {print $2}' | xargs -r sudo apt-get remove -y
        sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libgstreamer1.0-dev
    - name: Version matches the tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' app/src-tauri/tauri.conf.json | head -1)"
        test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but app version ${version}"; exit 1; }
    - name: Telegram credentials present
      env:
        TG_API_ID: ${{ secrets.TG_API_ID }}
        TG_API_HASH: ${{ secrets.TG_API_HASH }}
      run: |
        if [ -z "${TG_API_ID}" ] || [ -z "${TG_API_HASH}" ]; then
          echo "::error::repository secrets TG_API_ID / TG_API_HASH are missing"
          exit 1
        fi
    - name: Rust cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          app/src-tauri/target
        key: cargo-release-${{ matrix.arch }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
        restore-keys: cargo-release-${{ matrix.arch }}-
    - name: appimagetool
      run: |
        # the continuous build is the maintained one (no tagged releases)
        curl -fsSL -o "${RUNNER_TEMP}/appimagetool" \
          "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
        chmod +x "${RUNNER_TEMP}/appimagetool"
        echo "APPIMAGETOOL=${RUNNER_TEMP}/appimagetool" >> "$GITHUB_ENV"
    - name: Package
      env:
        TG_API_ID: ${{ secrets.TG_API_ID }}
        TG_API_HASH: ${{ secrets.TG_API_HASH }}
      run: utils/dist/package-linux --appimage
    - name: Install script works with the package
      run: |
        HOME="$(mktemp -d)" BRAIDS_TARBALL="$PWD/dist/braids-linux-${{ matrix.arch }}.tar.gz" sh utils/dist/install.sh
    - name: Keep packages
      uses: actions/upload-artifact@v4
      with:
        name: braids-linux-${{ matrix.arch }}
        path: |
          dist/*.tar.gz
          dist/*.deb
          dist/*.AppImage
          dist/*.sha256

  flatpak:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Release tarball
      uses: actions/download-artifact@v4
      with:
        name: braids-linux-${{ matrix.arch }}
        path: dist
    - name: Flathub shared modules (tray icon library)
      run: git clone --depth 1 https://github.com/flathub/shared-modules utils/dist/flatpak/shared-modules
    - name: Build
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        manifest-path: utils/dist/flatpak/io.github.pebll.braids.yml
        bundle: braids-${{ matrix.arch }}.flatpak
        arch: ${{ matrix.arch }}
        upload-artifact: false
        cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
    - name: Flathub checks (linter, as on Flathub)
      # reported, not blocking the release
      continue-on-error: true
      run: |
        flatpak-builder-lint --exceptions manifest utils/dist/flatpak/io.github.pebll.braids.yml
        flatpak-builder-lint --exceptions repo repo
    - name: Checksum
      run: sha256sum "braids-${{ matrix.arch }}.flatpak" > "braids-${{ matrix.arch }}.flatpak.sha256"
    - name: Keep package
      uses: actions/upload-artifact@v4
      with:
        name: braids-flatpak-${{ matrix.arch }}
        path: |
          braids-${{ matrix.arch }}.flatpak
          braids-${{ matrix.arch }}.flatpak.sha256

  nix:
    # the Nix package (nix/package.nix) with this build's tarball: its
    # libraries from nixpkgs resolve and braidsd loads every protocol
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Release tarball
      uses: actions/download-artifact@v4
      with:
        name: braids-linux-x86_64
        path: dist
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Build and check
      run: |
        nix-build -E 'with import <nixpkgs> {}; callPackage ./nix/package.nix {
          tarball = ./dist/braids-linux-x86_64.tar.gz; release = { version = "ci"; sha256 = {}; }; }'
        ldd=$(nix-build --no-out-link '<nixpkgs>' -A glibc.bin)/bin/ldd
        ! $ldd result/bin/.braids-wrapped result/bin/.braidsd-wrapped | grep "not found"
        HOME="$(mktemp -d)" result/bin/braidsd --list-protocols
    - name: Flake evaluates
      run: nix --extra-experimental-features "nix-command flakes" flake check --no-build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, nix]
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Packages
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Release notes from CHANGELOG.md
      run: |
        version="${GITHUB_REF_NAME#v}"
        # the section of this version, without its heading
        awk -v v="$version" '
          /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
          /^\[[^]]*\]: / { if (on) exit }
          on' CHANGELOG.md > notes.md
        if [ ! -s notes.md ]; then
          echo "::warning::no section for ${version} in CHANGELOG.md"
          echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > notes.md
        fi
        cat >> notes.md <<EOF

        **Install or update:** \`curl -fsSL https://pebll.github.io/braids/install.sh | sh\`, or pick a package below (.deb, Flatpak, AppImage, archive; x86_64 and ARM64).
        EOF
        cat notes.md
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        body_path: notes.md
        generate_release_notes: true
        files: |
          dist/*.tar.gz
          dist/*.deb
          dist/*.AppImage
          dist/*.flatpak
          dist/*.sha256
          utils/dist/install.sh

  nix-release:
    # the flake (nix run github:pebll/braids) follows the published release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - name: Checkout main
      uses: actions/checkout@v5
      with:
        ref: main
    - name: nix/release.json of this release
      run: |
        utils/dist/nix-update "${GITHUB_REF_NAME#v}"
        if git diff --quiet; then exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "Nix: braids ${GITHUB_REF_NAME#v}"
        git push origin HEAD:main
