name: Website

# Publishes site/ (the presentation website) and the install script to GitHub
# Pages: https://pebll.github.io/braids/ and .../install.sh. Needs Pages enabled
# with "GitHub Actions" as source (Settings -> Pages).

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'utils/dist/install.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Assemble
      run: |
        mkdir -p _site
        cp -r site/. _site/
        cp utils/dist/install.sh _site/install.sh
    - name: Upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
