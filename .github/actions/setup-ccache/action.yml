name: setup-ccache

inputs:
  max_size:
    description: Max ccache size (tdlib alone needs more than 1G)
    default: 3G

  cache_key_prefix:
    description: Cache key prefix
    default: ""   # leave empty, auto-use repo name

runs:
  using: composite
  steps:
    - name: Install ccache (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ccache

    - name: Install ccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install ccache

    - name: Compute cache key
      id: cache-key
      shell: bash
      run: |
        if [ -n "${{ inputs.cache_key_prefix }}" ]; then
          PREFIX="${{ inputs.cache_key_prefix }}"
        else
          PREFIX="${GITHUB_REPOSITORY##*/}"
        fi
        COMPILER_VER="$(cc --version 2>&1 | head -1)"
        COMPILER_HASH="$(echo "${COMPILER_VER}" | shasum -a 256 | cut -d' ' -f1 | head -c 16)"
        echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
        echo "ccache_dir=$HOME/.ccache" >> "$GITHUB_OUTPUT"
        echo "compiler_hash=${COMPILER_HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore ccache
      # Check https://github.com/actions/cache/releases for newer major versions.
      uses: actions/cache@v5
      with:
        path: ${{ steps.cache-key.outputs.ccache_dir }}
        # cache entries cannot be overwritten: a key per run saves the grown
        # cache every time, the restore keys pick the newest one
        key: ${{ steps.cache-key.outputs.prefix }}-${{ runner.os }}-${{ steps.cache-key.outputs.compiler_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.cache-key.outputs.prefix }}-${{ runner.os }}-${{ steps.cache-key.outputs.compiler_hash }}-
          ${{ steps.cache-key.outputs.prefix }}-${{ runner.os }}-

    - name: Configure ccache
      shell: bash
      run: |
        # the directory the cache step saves; with CCACHE_DIR set, ccache keeps
        # its config there too (so the settings below travel with the cache)
        export CCACHE_DIR="${{ steps.cache-key.outputs.ccache_dir }}"
        mkdir -p "${CCACHE_DIR}"
        echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
        ccache --set-config=max_size=${{ inputs.max_size }}
        # hits across checkouts in different directories
        ccache --set-config=base_dir=${{ github.workspace }}
        ccache --zero-stats
